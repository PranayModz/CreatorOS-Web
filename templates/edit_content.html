{% extends 'base.html' %}

{% block content %}

<h1>Edit Content</h1>

<form method="POST" class="card">

    {% csrf_token %}

    <label>Title</label>

    <input type="text"
           name="title"
           maxlength="255"
           value="{{ item.title }}"
           required>

    <label>Content</label>

    <textarea name="content"
              rows="20"
              required>{{ item.content }}</textarea>

    <button type="submit">Save Changes</button>

</form>

{% endblock %}
